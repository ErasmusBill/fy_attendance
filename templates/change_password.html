{% extends "base.html" %}
{% load static %}

{% block title %}Change Password | Church Attendance System{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
        
    <div>
        <a href="{% url 'admin_dashboard' %}" class="inline-flex items-center gap-2 text-xs font-semibold text-blue-600 hover:text-blue-800 transition">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            <span>Back to Dashboard</span>
        </a>
    </div>

        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
            
            <div class="p-6 sm:p-8 border-b border-slate-200 bg-slate-50/60 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center font-bold">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Change Your Password</h1>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Keep your account secure with a strong password.</p>
                </div>
            </div>

            <form method="POST" class="p-6 sm:p-8 space-y-5" novalidate id="change-password-form">
                {% csrf_token %}

                <!-- Old Password -->
                <div>
                    <label for="id_old_password" class="block text-xs font-semibold text-slate-700 mb-1">Current Password *</label>
                    <div class="relative rounded-lg shadow-xs">
                        <input 
                            type="password" 
                            name="old_password" 
                            id="id_old_password" 
                            required 
                            placeholder="Enter current password" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label for="id_new_password1" class="block text-xs font-semibold text-slate-700 mb-1">New Password * (Min 8 characters)</label>
                    <div class="relative rounded-lg shadow-xs">
                        <input 
                            type="password" 
                            name="new_password1" 
                            id="id_new_password1" 
                            required 
                            placeholder="Enter new password" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                        
                        <button 
                            type="button" 
                            id="toggle-change-pwd" 
                            data-target="id_new_password1" 
                            tabindex="-1"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition">
                            <svg class="eye-open h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg class="eye-closed h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Password strength indicator -->
                    <div class="mt-2">
                        <div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                            <div id="password-strength-bar" class="h-full w-0 transition-all duration-300 bg-red-500"></div>
                        </div>
                        <div class="flex justify-between items-center text-[11px] text-slate-500 mt-1">
                            <span>Strength: <strong id="password-strength-text" class="text-slate-600">Too Short</strong></span>
                            <span class="text-slate-400">Min 8 chars</span>
                        </div>
                    </div>
                </div>

                <!-- Repeat New Password -->
                <div>
                    <label for="id_new_password2" class="block text-xs font-semibold text-slate-700 mb-1">Confirm New Password *</label>
                    <div class="relative rounded-lg shadow-xs">
                        <input 
                            type="password" 
                            name="new_password2" 
                            id="id_new_password2" 
                            required 
                            placeholder="Confirm new password" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                </div>

                <!-- Action Row -->
                <div class="pt-4 border-t border-slate-200 flex items-center justify-end gap-3">
                    <a href="{% url 'admin_dashboard' %}" class="px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50 transition">
                        Cancel
                    </a>
                    <button type="submit" class="px-5 py-2.5 rounded-lg brand-blue text-white text-sm font-semibold shadow-xs hover:opacity-95 transition cursor-pointer">
                        Update Password
                    </button>
                </div>

            </form>

        </div>

</div>
{% endblock %}
