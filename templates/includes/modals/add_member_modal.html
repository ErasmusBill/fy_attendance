<!-- ============================================================== -->
<!-- GLOBAL ADD MEMBER MODAL                                       -->
<!-- ============================================================== -->
<div id="global-add-member-modal" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true">
    
    <!-- Backdrop Blur Overlay -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity" onclick="closeAddMemberModal()"></div>

    <!-- Modal Dialog Center -->
    <div class="min-h-full flex items-center justify-center p-4 text-center sm:p-0">
        <div class="relative bg-white rounded-3xl border border-slate-200 shadow-2xl text-left overflow-hidden transform transition-all sm:my-8 sm:max-w-lg sm:w-full p-6 sm:p-8 animate-fade-in">
            
            <!-- Close Button -->
            <button 
                type="button" 
                onclick="closeAddMemberModal()" 
                class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 p-2 rounded-xl transition cursor-pointer">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>

            <!-- Modal Header -->
            <div class="flex items-center gap-3.5 mb-5 pb-4 border-b border-slate-100">
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 shadow-inner">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-slate-900 leading-tight">Add New Congregant</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Generates a permanent Member ID (FY-0001+) and stores their profile.</p>
                </div>
            </div>

            <!-- Form -->
            <form id="global-add-member-form" method="POST" action="{% url 'members:member_create' %}" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.path }}">
                
                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name *</label>
                    <input 
                        type="text" 
                        name="name" 
                        required 
                        placeholder="e.g. John Kwame Mensah" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs sm:text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                </div>

                <!-- Grid: Email & Phone -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address *</label>
                        <input 
                            type="email" 
                            name="email" 
                            required 
                            placeholder="john@example.com" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs sm:text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Phone Number (For SMS ID) *</label>
                        <input 
                            type="tel" 
                            name="phone_number" 
                            required 
                            placeholder="+233 24 123 4567" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs sm:text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                </div>

                <!-- Grid: Department & Date of Birth -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Ministry / Department *</label>
                        <select 
                            name="department" 
                            required 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs sm:text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                            <option value="">Select Department</option>
                            {% for dept in global_departments %}
                                <option value="{{ dept.id }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Date of Birth *</label>
                        <input 
                            type="date" 
                            name="date_of_birth" 
                            required 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs sm:text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                </div>

                <!-- Residence / Address -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Residential Address *</label>
                    <textarea 
                        name="address" 
                        required 
                        rows="2" 
                        placeholder="e.g. East Legon, Accra / House No. 42" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs sm:text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition resize-none"></textarea>
                </div>

                <!-- Buttons -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <button 
                        type="button" 
                        onclick="closeAddMemberModal()" 
                        class="px-4 py-2.5 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition cursor-pointer">
                        Cancel
                    </button>
                    <button 
                        type="submit" 
                        id="submit-member-btn"
                        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl brand-blue text-white text-xs font-bold shadow-md hover:opacity-95 transition cursor-pointer">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                        </svg>
                        <span>Save &amp; Generate Member ID</span>
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
