{% load static %}
<!-- ============================================================== -->
<!-- UNIFIED TOPBAR (Header with Global Search, Quick Modals & User) -->
<!-- ============================================================== -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 gap-4">
            
            <!-- Left: Mobile Menu Toggle & Global Search Bar -->
            <div class="flex items-center gap-3 flex-1 max-w-xl">
                <button type="button" onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 transition" title="Toggle Sidebar">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <!-- Search Input Form -->
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                    <form method="GET" action="{% url 'attendance:attendance_dashboard' %}">
                        <input 
                            type="text" 
                            name="q" 
                            placeholder="Search members, services, or reports..." 
                            class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                    </form>
                </div>
            </div>

            <!-- Right: Quick Modals, Notifications & User Profile -->
            <div class="flex items-center gap-2 sm:gap-3">
                
                <!-- Quick Action: Mark Attendance Modal Button -->
                <button 
                    type="button" 
                    onclick="openQuickAttendanceModal()" 
                    class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 hover:bg-emerald-100 font-bold text-xs transition shadow-xs cursor-pointer">
                    <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                    </svg>
                    <span>Mark Attendance</span>
                </button>

                <!-- Quick Action: Add Member Modal Button -->
                <button 
                    type="button" 
                    onclick="openAddMemberModal()" 
                    class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-50 border border-blue-200 text-blue-800 hover:bg-blue-100 font-bold text-xs transition shadow-xs cursor-pointer">
                    <svg class="w-3.5 h-3.5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>+ Add Member</span>
                </button>

                <!-- Quick Action: Bulk SMS Broadcast Button -->
                <a 
                    href="{% url 'members:bulk_sms' %}" 
                    class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-800 hover:bg-indigo-100 font-bold text-xs transition shadow-xs">
                    <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    <span>Send SMS</span>
                </a>

                <!-- User Profile Pill -->
                <div class="relative">
                    <button type="button" onclick="toggleDropdown('user-menu')" class="flex items-center gap-2 p-1.5 rounded-xl hover:bg-slate-100 transition text-left cursor-pointer">
                        {% if request.user.profile.avatar %}
                            <img src="{{ request.user.profile.avatar.url }}" alt="{{ request.user.get_full_name }}" class="w-8 h-8 rounded-full object-cover border border-slate-200">
                        {% else %}
                            <div class="w-8 h-8 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-xs uppercase shadow-xs">
                                {{ request.user.first_name|slice:":1" }}{{ request.user.last_name|slice:":1" }}
                            </div>
                        {% endif %}
                        <div class="hidden sm:block leading-tight">
                            <div class="text-xs font-bold text-slate-900">{{ request.user.get_full_name|default:request.user.email }}</div>
                            <div class="text-[10px] text-slate-500 capitalize font-medium">{{ request.user.role|default:'Staff' }}</div>
                        </div>
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>

                    <!-- User Dropdown Menu -->
                    <div id="user-menu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-200 py-2 z-50 text-xs font-medium text-slate-700">
                        <div class="px-4 py-2 border-b border-slate-100">
                            <div class="font-bold text-slate-900">{{ request.user.get_full_name }}</div>
                            <div class="text-[10px] text-slate-400">{{ request.user.email }}</div>
                        </div>
                        <a href="{% url 'change_password' %}" class="flex items-center gap-2 px-4 py-2 hover:bg-slate-50 hover:text-blue-600 transition">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                            <span>Change Password</span>
                        </a>
                        {% if is_admin %}
                        <a href="{% url 'staff_users_dashboard' %}" class="flex items-center gap-2 px-4 py-2 hover:bg-slate-50 hover:text-blue-600 transition">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                            <span>Staff Accounts</span>
                        </a>
                        {% endif %}
                        <a href="{% url 'members:bulk_sms' %}" class="flex items-center gap-2 px-4 py-2 hover:bg-slate-50 hover:text-blue-600 transition">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                            <span>Bulk SMS (Mnotify)</span>
                        </a>
                        <div class="border-t border-slate-100 my-1"></div>
                        <a href="{% url 'logout' %}" class="flex items-center gap-2 px-4 py-2 text-rose-600 hover:bg-rose-50 transition font-bold">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                            <span>Sign Out</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</header>
